services:
  - type: web
    name: framer-export-tool
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 8 --timeout 180 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
